services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cinegate
      POSTGRES_USER: cinegate
      POSTGRES_PASSWORD: ${CINEGATE_POSTGRES_PASSWORD:?set CINEGATE_POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinegate -d cinegate"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - cinegate_postgres:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  cinegate_postgres:
