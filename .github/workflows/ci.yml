name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cinegate_ci
          POSTGRES_USER: cinegate
          POSTGRES_PASSWORD: cinegate_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cinegate -d cinegate_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      CINEGATE_DATABASE_URL: postgresql+asyncpg://cinegate:cinegate_ci_password@127.0.0.1:5432/cinegate_ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,import]"

      - name: Ruff
        run: ruff check .

      - name: Apply migrations
        run: alembic upgrade head

      - name: Tests
        run: pytest -q

      - name: Migration rollback and restore
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: Compile
        run: python -m compileall -q src tests

      - name: Shell scripts
        run: bash -n scripts/*.sh
